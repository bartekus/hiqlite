[meta]
required_version = "=0.20.0"

[manifest]
metadata_namespace = "spec-spine"

[layout]
specs_dir = "specs"
derived_dir = ".derived"
standards_dir = "standards/spec"
schemas_dir = "standards/schemas"
cargo_workspace = "Cargo.toml"
npm_workspaces = ["package.json", "pnpm-workspace.yaml"]
standalone_rust_workspaces = [
  # Workspace-excluded example crates (Cargo.toml `exclude = ["examples"]`).
  # Declaring them puts their .rs files in the coverage denominator; it does
  # not hash them, which is why the globs below exist too.
  "examples/bench",
  "examples/cache-only",
  "examples/derive-complex-types",
  "examples/external-state-machine",
  "examples/sqlite-only",
  "examples/walkthrough",
]
standalone_npm_packages = ["dashboard"]

[index]
# These are the bounded pilot's contract-bearing implementation and workflow bytes.
# Directory claims are also walked by the pinned tool. Keeping the explicit globs
# makes the intended freshness boundary visible in one place.
extra_hashed_inputs = [
  "hiqlite-wal/src/**/*.rs",
  "hiqlite/src/config.rs",
  # The rest of the configuration contract, claimed by 009. config_toml.rs is
  # already in the hiqlite package walk for coverage, but package membership
  # does not feed the freshness hash, and the two reference files are in
  # neither, so all three are listed here.
  "hiqlite/src/config_toml.rs",
  "hiqlite.toml",
  "hiqlite.env",
  # The node lifecycle, claimed by 010. These four live at the crate root, which
  # no other glob here reaches; the hiqlite package walk already counts them in
  # the coverage denominator, so only the freshness hash needs them.
  "hiqlite/src/start.rs",
  "hiqlite/src/init.rs",
  "hiqlite/src/app_state.rs",
  "hiqlite/src/split_brain_check.rs",
  "hiqlite/src/query/**/*.rs",
  "hiqlite/src/client/**/*.rs",
  "hiqlite/src/network/**/*.rs",
  "hiqlite/src/server/proxy/stream.rs",
  "hiqlite/src/store/state_machine/sqlite/**/*.rs",
  "hiqlite/src/external_state_machine.rs",
  "hiqlite/tests/cluster/**/*.rs",
  "ARCHITECTURE.md",
  ".gitignore",
  "justfile",
  ".github/workflows/spec-spine.yaml",
  # Governance inputs. The tier-1 spec, tier-2 constitution, tier-3 contract,
  # the authoring templates, and the shared agent protocol all change what the
  # corpus means, so a byte change in any of them must stale the committed
  # index the same way a source change does.
  "AGENTS.md",
  "standards/spec/**/*.md",
  # Authored dashboard source and its build configuration. Declaring the npm
  # package above puts its .ts and .js files in the coverage denominator, but
  # the pinned indexer does not treat .svelte as package source, and package
  # declaration does not feed the freshness hash at all. These globs cover both
  # gaps: every authored dashboard file is hashed, and the ones the package
  # walk misses enter the denominator through the declared scope.
  "dashboard/src/**/*.svelte",
  "dashboard/src/**/*.ts",
  "dashboard/src/**/*.js",
  "dashboard/src/**/*.css",
  "dashboard/src/**/*.html",
  "dashboard/package.json",
  "dashboard/svelte.config.js",
  "dashboard/vite.config.ts",
  "dashboard/tsconfig.json",
  "dashboard/playwright.config.ts",
  "dashboard/tests/**/*.ts",
  # Example inputs the Rust package walk does not cover. The .rs files are
  # already covered by the standalone workspace declarations above; adding them
  # here as well would be redundant.
  "examples/*/migrations/*.sql",
  "examples/*/Cargo.toml",
]
resolver_exclusions = ["target", "node_modules", ".derived", "dist", "build", ".next"]
slices = {}

[branding]
compiler_id = "spec-spine"
indexer_id = "spec-spine"

[coupling]
bypass_prefixes = []
waiver_keyword = "Spec-Drift-Waiver:"
# Bounded adoption: owned pilot paths are enforced by C-001. Unclaimed source
# remains migration debt and does not produce repository-wide C-002 failures.
require_ownership = false
auto_waive_dependency_only = false

[coverage]
governed_scope = [
  "ARCHITECTURE.md",
  "justfile",
  "spec-spine.toml",
  "AGENTS.md",
  # The two configuration reference files 009 claims. They are root files that
  # no package walk discovers, so without these they would be owned but absent
  # from the denominator.
  "hiqlite.toml",
  "hiqlite.env",
  "standards/spec/**/*.md",
  # Authored dashboard source and its build configuration. Declaring the npm
  # package above puts its .ts and .js files in the coverage denominator, but
  # the pinned indexer does not treat .svelte as package source, and package
  # declaration does not feed the freshness hash at all. These globs cover both
  # gaps: every authored dashboard file is hashed, and the ones the package
  # walk misses enter the denominator through the declared scope.
  "dashboard/src/**/*.svelte",
  "dashboard/src/**/*.ts",
  "dashboard/src/**/*.js",
  "dashboard/src/**/*.css",
  "dashboard/src/**/*.html",
  "dashboard/package.json",
  "dashboard/svelte.config.js",
  "dashboard/vite.config.ts",
  "dashboard/tsconfig.json",
  "dashboard/playwright.config.ts",
  "dashboard/tests/**/*.ts",
  # Example inputs the Rust package walk does not cover. The .rs files are
  # already covered by the standalone workspace declarations above; adding them
  # here as well would be redundant.
  "examples/*/migrations/*.sql",
  "examples/*/Cargo.toml",
]
governed_scope_exclusions = []

[provenance.uri_schemes]
knowledge = "knowledge://"
code-fingerprint = "fingerprint://"

[frontmatter]
extra_known_keys = []

[lint]
unwitnessed_allowed = []
