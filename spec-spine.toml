[meta]
required_version = "=0.20.0"

[manifest]
metadata_namespace = "spec-spine"

[layout]
specs_dir = "specs"
derived_dir = ".derived"
standards_dir = "standards/spec"
schemas_dir = "standards/schemas"
cargo_workspace = "Cargo.toml"
npm_workspaces = ["package.json", "pnpm-workspace.yaml"]
standalone_rust_workspaces = [
  # Workspace-excluded example crates (Cargo.toml `exclude = ["examples"]`).
  # Declaring them puts their .rs files in the coverage denominator; it does
  # not hash them, which is why the globs below exist too.
  "examples/bench",
  "examples/cache-only",
  "examples/derive-complex-types",
  "examples/external-state-machine",
  "examples/sqlite-only",
  "examples/walkthrough",
]
standalone_npm_packages = ["dashboard"]

[index]
# These are the bounded pilot's contract-bearing implementation and workflow bytes.
# Directory claims are also walked by the pinned tool. Keeping the explicit globs
# makes the intended freshness boundary visible in one place.
extra_hashed_inputs = [
  "hiqlite-wal/src/**/*.rs",
  # The derive macros, claimed by 016. The package walk already counts these
  # three files in the coverage denominator; package membership does not feed
  # the freshness hash, so they need this entry.
  "hiqlite-derive/src/**/*.rs",
  "hiqlite/src/config.rs",
  # The rest of the configuration contract, claimed by 009. config_toml.rs is
  # already in the hiqlite package walk for coverage, but package membership
  # does not feed the freshness hash, and the two reference files are in
  # neither, so all three are listed here.
  "hiqlite/src/config_toml.rs",
  "hiqlite.toml",
  "hiqlite.env",
  # The node lifecycle, claimed by 010. These four live at the crate root, which
  # no other glob here reaches; the hiqlite package walk already counts them in
  # the coverage denominator, so only the freshness hash needs them.
  "hiqlite/src/start.rs",
  # Exclusive storage ownership, claimed by 024. It lives at the crate root, which no other
  # glob here reaches; the hiqlite package walk already counts it in the coverage denominator,
  # so only the freshness hash needs it.
  "hiqlite/src/storage_lock.rs",
  # The node lifecycle contract and the abort-profile probe, claimed by 027. Both live at the
  # crate root or in `src/bin`, which no other glob here reaches; the hiqlite package walk
  # already counts them in the coverage denominator, so only the freshness hash needs them.
  "hiqlite/src/lifecycle.rs",
  "hiqlite/src/bin/*.rs",
  # The membership gate, claimed by 027 for F-107. Crate root, same reason as the two above.
  "hiqlite/src/membership_gate.rs",
  "hiqlite/src/init.rs",
  "hiqlite/src/app_state.rs",
  "hiqlite/src/split_brain_check.rs",
  # Transport security material and its REST client, claimed by 011, plus that
  # spec's own environment-route test target, which sits outside the
  # hiqlite/tests/cluster glob below.
  "hiqlite/src/tls.rs",
  "hiqlite/src/http_client.rs",
  "hiqlite/tests/tls_env.rs",
  # Backup, retention and object storage, claimed by 013, and the schema
  # migration builder claimed by 014 together with the fixture set its tests
  # embed. All three .rs files live at the crate root, which no other glob here
  # reaches; the hiqlite package walk already counts them in the coverage
  # denominator, so only the freshness hash needs them. The .sql fixtures are in
  # neither, so they need this entry for both.
  "hiqlite/src/backup.rs",
  "hiqlite/src/s3.rs",
  "hiqlite/src/migration.rs",
  "hiqlite/tests/cluster/migrations/**/*.sql",
  "hiqlite/src/query/**/*.rs",
  "hiqlite/src/client/**/*.rs",
  "hiqlite/src/network/**/*.rs",
  "hiqlite/src/server/proxy/stream.rs",
  # The dashboard service, claimed by 018. Its browser-side counterpart needs no
  # entry: the dashboard/src globs below already hash and count it.
  "hiqlite/src/dashboard/**/*.rs",
  # The server binary and the proxy, claimed by 015. The subtree glob subsumes
  # the proxy/stream.rs entry above, which is kept because it is 000's
  # statement about 003's territory and 015 does not own that statement.
  "hiqlite/src/main.rs",
  "hiqlite/src/server/**/*.rs",
  "hiqlite/src/store/state_machine/sqlite/**/*.rs",
  "hiqlite/src/external_state_machine.rs",
  "hiqlite/tests/cluster/**/*.rs",
  "ARCHITECTURE.md",
  ".gitignore",
  "justfile",
  ".github/workflows/spec-spine.yaml",
  # The post-merge acceptance workflow, claimed by 028.
  ".github/workflows/acceptance.yaml",
  # The publication and review workflows, claimed by 031.
  ".github/workflows/publish.yaml",
  ".github/workflows/ai-review.yaml",
  # The release ledger, claimed by 031. `standards/spec/**/*.md` above already covers it;
  # named here only so a reader of this list sees the release documents together.
  # Governance inputs. The tier-1 spec, tier-2 constitution, tier-3 contract,
  # the authoring templates, and the shared agent protocol all change what the
  # corpus means, so a byte change in any of them must stale the committed
  # index the same way a source change does.
  "AGENTS.md",
  "standards/spec/**/*.md",
  # Authored dashboard source and its build configuration. Declaring the npm
  # package above puts its .ts and .js files in the coverage denominator, but
  # the pinned indexer does not treat .svelte as package source, and package
  # declaration does not feed the freshness hash at all. These globs cover both
  # gaps: every authored dashboard file is hashed, and the ones the package
  # walk misses enter the denominator through the declared scope.
  "dashboard/src/**/*.svelte",
  "dashboard/src/**/*.ts",
  "dashboard/src/**/*.js",
  "dashboard/src/**/*.css",
  "dashboard/src/**/*.html",
  "dashboard/package.json",
  "dashboard/svelte.config.js",
  "dashboard/vite.config.ts",
  "dashboard/tsconfig.json",
  "dashboard/playwright.config.ts",
  "dashboard/tests/**/*.ts",
  # Example inputs the Rust package walk does not cover, plus the example
  # sources themselves. The standalone workspace declarations above put the .rs
  # files in the coverage denominator but do not hash them, which is what the
  # first glob here is for: 017 claims all seven, so a byte change in one must
  # stale the committed index.
  "examples/*/src/*.rs",
  "examples/*/migrations/*.sql",
  "examples/*/Cargo.toml",
]
# These are matched as path **components**, not as path prefixes. That distinction is the whole
# of W-14: the 2026-09-19 probe recorded this key as having "no effect" because it tried
# `"hiqlite/static"` and `"dashboard/src/spow"`, which are prefixes and match no component.
# `"static"` and `"spow"` are components, and they do exactly what rung 0 asked for.
#
# `static` is the dashboard's generated output, governed through its build contract by `019`
# and never claimed as authored bytes (OD-2). `spow` is vendored third-party WebAssembly
# bindings, referenced and never claimed (A15). Both leave the coverage denominator; neither
# is added to `coupling.bypass_prefixes`, so no ownership check on authored source is weakened.
# Verified by probe, recorded in `028`.
resolver_exclusions = [
  "target",
  "node_modules",
  ".derived",
  "dist",
  "build",
  ".next",
  "static",
  "spow",
]
slices = {}

[branding]
compiler_id = "spec-spine"
indexer_id = "spec-spine"

[coupling]
bypass_prefixes = []
waiver_keyword = "Spec-Drift-Waiver:"
# Bounded adoption: owned pilot paths are enforced by C-001. Unclaimed source
# remains migration debt and does not produce repository-wide C-002 failures.
require_ownership = false
auto_waive_dependency_only = false

[coverage]
governed_scope = [
  "ARCHITECTURE.md",
  "justfile",
  "spec-spine.toml",
  "AGENTS.md",
  # The two configuration reference files 009 claims. They are root files that
  # no package walk discovers, so without these they would be owned but absent
  # from the denominator.
  "hiqlite.toml",
  "hiqlite.env",
  "standards/spec/**/*.md",
  # Authored dashboard source and its build configuration. Declaring the npm
  # package above puts its .ts and .js files in the coverage denominator, but
  # the pinned indexer does not treat .svelte as package source, and package
  # declaration does not feed the freshness hash at all. These globs cover both
  # gaps: every authored dashboard file is hashed, and the ones the package
  # walk misses enter the denominator through the declared scope.
  "dashboard/src/**/*.svelte",
  "dashboard/src/**/*.ts",
  "dashboard/src/**/*.js",
  "dashboard/src/**/*.css",
  "dashboard/src/**/*.html",
  "dashboard/package.json",
  "dashboard/svelte.config.js",
  "dashboard/vite.config.ts",
  "dashboard/tsconfig.json",
  "dashboard/playwright.config.ts",
  "dashboard/tests/**/*.ts",
  # Example inputs the Rust package walk does not cover. The .rs files are
  # already covered by the standalone workspace declarations above; adding them
  # here as well would be redundant.
  "examples/*/migrations/*.sql",
  "examples/*/Cargo.toml",
  # The migration fixture set 014 claims. These are .sql files inside the
  # hiqlite package, which the Rust package walk does not discover, so without
  # this entry they would be owned but absent from the denominator.
  "hiqlite/tests/cluster/migrations/**/*.sql",
]
governed_scope_exclusions = []

[provenance.uri_schemes]
knowledge = "knowledge://"
code-fingerprint = "fingerprint://"

[frontmatter]
extra_known_keys = []

[lint]
unwitnessed_allowed = []
