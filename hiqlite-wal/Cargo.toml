[package]
name = "hiqlite-wal"
version = "0.14.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version = "1.88"
categories = ["database", "caching"]
keywords = ["database", "raft", "cache", "wal"]
description = "WAL file implementation for Hiqlite"
repository = "https://github.com/sebadob/hiqlite"

[features]
auto-heal = []
migration = []
# Oversized raft entries panic the writer by default (a non-recoverable setup issue).
# Enable this to fail the append with `Error::WalSizeExceeded` and keep the writer alive.
oversized-entry-error = []

[lib]
doctest = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
bincode.workspace = true
byteorder.workspace = true
crc.workspace = true
flume.workspace = true
fs4.workspace = true
memmap2.workspace = true
openraft.workspace = true
serde.workspace = true
thiserror.workspace = true
thread-priority.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `macros` for `#[tokio::test]`; the rest of the feature set comes from the workspace entry.
tokio = { workspace = true, features = ["macros"] }
# The writer reports an unexpected termination through `tracing`. Capturing that report is the
# only way a test can observe it, so the subscriber is a test-only dependency.
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
