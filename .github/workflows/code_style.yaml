name: Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# Least privilege for a pull-request trigger: this workflow reads the tree, runs the
# style and lint checks, and writes nothing back. Without this block it inherits the
# repository default, which is `write`, and a pull request from a branch in this
# repository would run with a token that can push. It references no secret and must
# not be given one: `031` keeps the publication and review credentials in workflows
# with their own triggers.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `clear` in the just recipes fails without TERM on CI runners
  TERM: xterm

jobs:
  check:
    if: github.event.pull_request.draft == false
    name: Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sebadob/rauthy-builder:20260519
    steps:
      - uses: actions/checkout@v4
      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings
      - name: Clippy (feature matrix)
        run: just clippy
      - name: Clippy (examples)
        run: just clippy-examples
      - name: Tests
        # S3 tests cannot be done inside GitHub CI
        run: just test-no-s3
