[package]
name = "hiqlite-patched"
version = "0.15.0-patched.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version = "1.95.0"
categories = ["database", "caching"]
keywords = ["database", "sql", "sqlite", "raft", "cache"]
description = "Hiqlite - highly-available, embeddable, raft-based SQLite + cache. Downstream patched build of Hiqlite, from the fork at bartekus/hiqlite. Not affiliated with or endorsed by the upstream project."
# `hiqlite/README.md` already exists and is what the archive would contain anyway; pointing at
# `../README.md` made `cargo package` warn that it was resolving to the copy in the package
# root. Naming it directly says what is published.
readme = "README.md"
repository = "https://github.com/bartekus/hiqlite"

[lib]
# The package is renamed and the library is not, so `use hiqlite::..` keeps working and the
# `::hiqlite::` paths the derive macros and `params!` emit resolve in a consumer's crate
# without a dependency alias. See `031` B-3.
name = "hiqlite"
doctest = false

# Runs the expected failure paths under `panic = "abort"`, which no test can do: Rust's test
# harness requires unwinding. Built only with the internal probe feature, so it is absent from
# every normal build.
[[bin]]
name = "hiqlite-abort-probe"
path = "src/bin/abort_probe.rs"
required-features = ["__abort-probe"]

[package.metadata.docs.rs]
all-features = false
features = ["full", "external-state-machine"]

[features]
default = ["auto-heal", "backup", "sqlite", "toml"]

auto-heal = ["hiqlite-wal/auto-heal"]
backup = ["dep:cron", "s3", "sqlite"]
cache = ["__cluster", "openraft/loosen-follower-log-revert"]
counters = ["cache"]
dashboard = [
    "dep:argon2",
    "dep:axum-extra",
    "dep:mime_guess",
    "dep:spow",
    "dep:tower",
    "dep:tower-http",
    "sqlite",
]
dlock = ["cache"]
cast_ints = []
cast_ints_unchecked = []
# Opt-in state-machine engine for applications that already own consensus.
# This reuses the SQLite connection, read-pool, restore, and single-writer
# machinery without starting a Hiqlite Raft group.
external-state-machine = [
    "dep:deadpool",
    "dep:fs4",
    "dep:rusqlite",
    "rusqlite/backup",
    "rusqlite/functions",
    "rusqlite/hooks",
]
full = [
    "auto-heal",
    "backup",
    "cache",
    "dashboard",
    "dlock",
    "listen_notify_local",
    "macros",
    "s3",
    "shutdown-handle",
    "sqlite",
    "toml",
]
# Opt-in: keep Cache Snapshots in-memory instead of on disk. This lets a pure
# cache-only node run without a `data_dir`, but doubles snapshot memory cost and
# disables zero-copy snapshot streaming from file. Deliberately NOT part of `full`.
in-memory-snapshots = ["cache"]
jemalloc = ["dep:tikv-jemallocator"]
listen_notify = [
    "dep:eventsource-client",
    "listen_notify_local"
]
listen_notify_local = [
    "dep:futures-util",
    "cache"
]
macros = ["dep:hiqlite-derive"]
toml = ["dep:toml"]
s3 = ["backup"]
server = [
    "dep:clap",
    "dep:home",
    "dep:tracing-subscriber",
    "full",
    "listen_notify",
    "tokio/macros",
]
shutdown-handle = ["dep:ctrlc"]
sqlite = [
    "__cluster",
    "dep:deadpool",
    "dep:rusqlite",
    "dep:serde_rusqlite",
]
webpki-roots = [
    "dep:webpki-root-certs",
]

# Internal dependency boundary for the regular Hiqlite Raft/network runtime.
# The external state-machine feature deliberately does not enable it.
__cluster = [
    "dep:axum",
    "dep:axum-server",
    "dep:bytes",
    "dep:chrono",
    "dep:crossbeam",
    "dep:cryptr",
    "dep:dotenvy",
    "dep:fastwebsockets",
    "dep:fs4",
    "dep:getrandom",
    "dep:hex",
    "dep:hiqlite-wal",
    "dep:hostname",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:lazy_static",
    "dep:lz4-sys",
    "dep:openraft",
    "dep:rcgen",
    "dep:reqwest",
    "dep:rust_decimal",
    "dep:rust-embed",
    "dep:rustls",
    "dep:rustls-webpki",
    "dep:serde_json",
    "dep:serde_rusqlite",
    "dep:time",
    "dep:tokio-rustls",
    "dep:tower-layer",
    "dep:tower-service",
    "dep:url",
]

# Internal use only
__profiling = ["dep:console-subscriber"]
# Internal use only: `035`'s real-version harness kills a candidate at a named step of the
# upgrade exclusion (`HQL_TEST_UPGRADE_FAULT`). Never enable it in a build anyone runs.
__upgrade-fault-points = []

# Internal use only: builds `hiqlite-abort-probe`. See the `[[bin]]` section above.
__abort-probe = ["sqlite", "cache", "tokio/rt", "tokio/macros"]

[dependencies]
# Renamed **packages**, kept **dependency keys**. The keys are what `dep:hiqlite-derive`,
# `dep:hiqlite-wal` and `hiqlite-wal/auto-heal` in the feature table above refer to, so keeping
# them means the feature table needs no change and cannot drift from the dependency names.
#
# `path` is for workspace development; `version` is what the published manifest resolves
# against, and publication is verified without the paths (`031` section 4). The requirement is
# exact (`=`): a caret requirement on a `-patched.N` prerelease also accepts every later `N`, so
# a published `hiqlite-patched` could otherwise resolve against a newer WAL crate (`036` B-2).
hiqlite-derive = { package = "hiqlite-derive-patched", version = "=0.15.0-patched.2", path = "../hiqlite-derive", optional = true }
hiqlite-wal = { package = "hiqlite-wal-patched", version = "=0.15.0-patched.2", path = "../hiqlite-wal", optional = true }

argon2 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
bincode.workspace = true
bytes = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
console-subscriber = { workspace = true, optional = true }
constant_time_eq = { workspace = true }
cron = { workspace = true, optional = true }
crossbeam = { workspace = true, optional = true }
cryptr = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
deadpool = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
eventsource-client = { workspace = true, optional = true }
fastwebsockets = { workspace = true, optional = true }
flume.workspace = true
fs4 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hostname = { workspace = true, optional = true }
home = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
openraft = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
serde_rusqlite = { workspace = true, optional = true }
sha2.workspace = true
spow = { workspace = true, optional = true }
thiserror.workspace = true
thread-priority.workspace = true
time = { workspace = true, optional = true }
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true
# reqwest 0.13 requires the full certs to make them useable
webpki-root-certs = { workspace = true, optional = true }

# make minimal versions happy
lazy_static = { workspace = true, optional = true }
lz4-sys = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
tower-layer = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }

# Necessary to fix security issues in current versions.
rustls-webpki = { workspace = true, optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
# `tests/upgrade_exclusion.rs`: a second process holding a WAL lock, as hiqlite 0.14 does.
fs4.workspace = true
tokio = { workspace = true, features = ["full", "test-util", "tracing"] }
tokio-test = "0.4.4"
tracing-subscriber.workspace = true
