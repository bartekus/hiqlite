[package]
name = "hiqlite-derive-patched"
version = "0.15.0-patched.4"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version = "1.88"
categories = ["database", "caching"]
keywords = ["database", "sql", "sqlite", "raft", "cache"]
description = "Macros for Hiqlite. Downstream patched build of Hiqlite, from the fork at bartekus/hiqlite. Not affiliated with or endorsed by the upstream project."
repository = "https://github.com/bartekus/hiqlite"

[lib]
# See `hiqlite-wal`'s manifest: the package is renamed and the library is not.
name = "hiqlite_derive"
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.90", features = [] }
syn = { version = "2.0.90", features = [] }
quote = "1.0.30"
