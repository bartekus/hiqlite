# The candidate: this repository's `hiqlite-patched`, by path (`035` D-3).
[package]
name = "n1-node-new"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "node-new"
path = "../src/node.rs"

[features]
rahi = ["hiqlite/sqlite", "hiqlite/cache", "hiqlite/counters", "hiqlite/dlock", "hiqlite/listen_notify_local", "hiqlite/backup", "hiqlite/s3"]
rauthy = ["hiqlite/default", "hiqlite/cache", "hiqlite/cast_ints", "hiqlite/counters", "hiqlite/dashboard", "hiqlite/listen_notify_local", "hiqlite/macros"]
# X-5 only: abort at a named step of the upgrade exclusion (`HQL_TEST_UPGRADE_FAULT`).
faults = ["hiqlite/__upgrade-fault-points"]

[dependencies]
hiqlite = { package = "hiqlite-patched", path = "../../../hiqlite", default-features = false }
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
strip = true

[workspace]
