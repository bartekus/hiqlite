# hiqlite 0.14 at upstream `8f3b9bd`, the build Rahi v0.2.0 and the published consumers ran
# before the upgrade (`035` D-3). Its own workspace, so it never enters the library's graph.
[package]
name = "n1-node-old"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "node-old"
path = "../src/node.rs"

[features]
# The consumers' exact hiqlite feature sets (`033` B-2).
rahi = ["hiqlite/sqlite", "hiqlite/cache", "hiqlite/counters", "hiqlite/dlock", "hiqlite/listen_notify_local", "hiqlite/backup", "hiqlite/s3"]
rauthy = ["hiqlite/default", "hiqlite/cache", "hiqlite/cast_ints", "hiqlite/counters", "hiqlite/dashboard", "hiqlite/listen_notify_local", "hiqlite/macros"]

[dependencies]
hiqlite = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["full"] }

[patch.crates-io]
hiqlite = { git = "https://github.com/sebadob/hiqlite", rev = "8f3b9bde9454d563d604f49c527e1527e193c4ab" }
hiqlite-wal = { git = "https://github.com/sebadob/hiqlite", rev = "8f3b9bde9454d563d604f49c527e1527e193c4ab" }

# The workspace's release profile, except link-time optimization, which only lengthens the build.
[profile.release]
panic = "abort"
strip = true

[workspace]
