# 033 B-2 and D-2: the real-node N=3 harness. This is its own workspace, so it is excluded
# from the repository root's workspace without editing it: its release builds and the two
# consumer feature sets never enter the library's graph, `cargo test` or `just test`.
[workspace]
resolver = "2"
members = ["proto", "node", "harness"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

# Mirrors the repository root's release profile, `panic = "abort"` included, because B-2
# requires each node to run from a release build with the workspace's panic strategy.
[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
