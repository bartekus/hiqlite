[package]
name = "n3-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "One hiqlite node as its own OS process, driven by the N=3 harness"

# Exactly one of these must be enabled; the binary refuses to compile otherwise. Build each
# into its own target directory (see README.md) so both binaries can exist side by side.
[features]
# Rahi's exact hiqlite feature set (033 B-2), no default features.
rahi = [
    "hiqlite/sqlite",
    "hiqlite/cache",
    "hiqlite/counters",
    "hiqlite/dlock",
    "hiqlite/listen_notify_local",
    "hiqlite/backup",
    "hiqlite/s3",
]
# Rauthy's: hiqlite's default features (auto-heal, backup, sqlite, toml, as declared in
# hiqlite/Cargo.toml) plus cache, cast_ints, counters, dashboard, listen_notify_local, macros.
rauthy = [
    "hiqlite/auto-heal",
    "hiqlite/backup",
    "hiqlite/sqlite",
    "hiqlite/toml",
    "hiqlite/cache",
    "hiqlite/cast_ints",
    "hiqlite/counters",
    "hiqlite/dashboard",
    "hiqlite/listen_notify_local",
    "hiqlite/macros",
]

[dependencies]
n3-proto = { path = "../proto" }
hiqlite = { package = "hiqlite-patched", path = "../../../hiqlite", default-features = false }
# Both feature sets enable `s3`, whose configuration check requires an encryption key.
cryptr = { version = "0.10", default-features = false }
serde = "1.0.114"
serde_json = "1.0.57"
tokio = { version = "1.43.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
